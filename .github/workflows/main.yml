name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build Clover Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Manage Version
        run: |
          git fetch --tags --force --no-recurse-submodules
          CUR_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Detected version: $CUR_TAG"
          echo "CUR_TAG=$CUR_TAG" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Dependencies
        run: brew install p7zip
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Fix OpenCorePkg Macro
        run: |
          sed -i '' 's|///#define OC_PLATFORM_NVRAM_CONFIG_FIELDS|#define OC_PLATFORM_NVRAM_CONFIG_FIELDS|g' OpenCorePkg/Include/Acidanthera/Library/OcConfigurationLib.h
          
          # Patch RADICAL: Forțează sistemul de securitate OpenCore să aprobe orice bootloader de Mac (boot.efi)
          TARGET_CRYPTO=$(find OpenCorePkg -name "OcCryptoLib.c" -o -name "SecureBoot.c" | head -n 1)
          if [ -n "$TARGET_CRYPTO" ]; then
            echo "Modificăm politica de criptare în $TARGET_CRYPTO"
            # Schimbă logica internă ca să returneze succes la orice verificare de securitate software
            sed -i '' 's/return Status;/return EFI_SUCCESS;/g' "$TARGET_CRYPTO" 2>/dev/null || true
          fi

      - name: Build Clover Pack
        run: |
          chmod +x ./buildme
          ./buildme "" ci -D ENABLE_SECURE_BOOT=1
      - name: Prepare Release Packs
        run: |
          (cd "CloverPackage/CloverV2/EFI/CLOVER/" && zip -q "CLOVERX64.efi.zip" "CLOVERX64.efi" || exit 1)
          (cd "CloverPackage/sym/CloverISO-${{ env.CUR_TAG }}" && 7z a Clover-${{ env.CUR_TAG }}-X64.iso.7z *.iso || exit 1)
          releaseItems=(CloverPackage/sym/CloverISO*/*.7z CloverPackage/sym/CloverV2*.zip CloverPackage/CloverV2/EFI/CLOVER/CLOVERX64.efi.zip CloverPackage/sym/Clover_r*.pkg)
          for releaseItem in "${releaseItems[@]}"; do cp -Rf "${releaseItem}" ./ || exit 1; done
      
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Clover-GCC-15.2.0-${{ env.GIT_SHA }}
          path: |
            *.7z
            CloverV2*.zip
            CLOVERX64.efi.zip
            Clover_r*.pkg

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.7z
            CloverV2*.zip
            CLOVERX64.efi.zip
            Clover_r*.pkg
          generate_release_notes: true
